# Copy to config/config.yaml and fill in every source_playlist_id and
# output_playlist_id with real Spotify playlist IDs (the string in a playlist's
# share link: open.spotify.com/playlist/<ID>).
#
# Spotify is the source of truth for what songs are in each stage's pool — this
# file only defines playlist ids, stage order, durations, and generator settings.
# For starter song suggestions per stage, see docs/spec_v4.md.
#
# Each stage's `id` is a stable identifier that stays fixed even if `name` (the
# display label) changes later.

generator:
  no_repeat_days: 15
  duration_tolerance_minutes: 2

spotify:
  redirect_uri: "http://127.0.0.1:8888/callback"

progressions:
  morning:
    output_playlist_name: "Today's Morning"
    output_playlist_id: ""
    stages:
      - id: wake_cinematic
        name: "Wake / Cinematic"
        source_playlist_id: ""
        target_minutes: 8
      - id: groove
        name: "Groove / Getting moving"
        source_playlist_id: ""
        target_minutes: 11
      - id: warm
        name: "Warm / Easy"
        source_playlist_id: ""
        target_minutes: 12
      - id: building_energy
        name: "Building energy"
        source_playlist_id: ""
        target_minutes: 14
      - id: full_send_fun
        name: "Full send / Fun"
        source_playlist_id: ""
        target_minutes: 15

  night:
    output_playlist_name: "Tonight's Wind Down"
    output_playlist_id: ""
    stages:
      - id: soft_landing
        name: "Soft landing"
        source_playlist_id: ""
        target_minutes: 10
      - id: reflective_emotional
        name: "Reflective / emotional"
        source_playlist_id: ""
        target_minutes: 10
      - id: deepening_atmospheric
        name: "Deepening / atmospheric"
        source_playlist_id: ""
        target_minutes: 12
      - id: instrumental_descent
        name: "Instrumental descent"
        source_playlist_id: ""
        target_minutes: 19
      - id: reading_journaling
        name: "Reading / journaling"
        source_playlist_id: ""
        open_ended: true
