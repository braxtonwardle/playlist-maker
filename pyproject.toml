[project]
name = "soundtrack-engine"
version = "0.1.0"
description = "Personal Soundtrack Engine — deterministic mood-arc Spotify playlist generator"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "itsdangerous>=2.1",
    "bcrypt>=4.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]

[project.scripts]
soundtrack-engine = "soundtrack_engine.cli:main"

[tool.setuptools.package-data]
"soundtrack_engine.dashboard" = ["templates/*.html", "static/*"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
