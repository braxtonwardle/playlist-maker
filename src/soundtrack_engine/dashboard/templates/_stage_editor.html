<div id="stage-editor">
  {% if saved %}<p class="flash success">Saved.</p>{% endif %}
  {% if save_error %}<p class="flash error">{{ save_error }}</p>{% endif %}
  <form hx-post="/api/config/{{ progression }}" hx-target="#stage-editor" hx-swap="outerHTML"
        x-data="{ dirty: false }" @input="dirty = true" @change="dirty = true">
    {% for stage in stages %}
    <div class="stage-card"
         style="--stage-color: {{ stage_colors[stage.id] }}"
         x-data="{
           infinite: {{ 'true' if stage.open_ended else 'false' }},
           minutes: {{ stage.target_minutes or 15 }},
           savedMinutes: {{ stage.target_minutes or 15 }},
           min: 1, max: 60,
         }">
      <div class="stage-card-header">
        <span class="stage-name">{{ stage.name }}</span>
        {% if loop.first or loop.last %}
        <label class="persist-check">
          <input type="checkbox" name="infinite__{{ stage.id }}" x-model="infinite">
          Infinite
        </label>
        {% endif %}
      </div>
      <div class="slider-row" :class="{ disabled: infinite }">
        <div class="slider-track-wrap">
          <input type="range" :min="min" :max="max" step="1"
                 name="minutes__{{ stage.id }}"
                 x-model.number="minutes"
                 :disabled="infinite">
          <span class="ghost-dot" x-show="!infinite && minutes !== savedMinutes" x-cloak
                :style="`left: ${(savedMinutes - min) / (max - min) * 100}%`"
                title="Saved value"></span>
        </div>
        <span class="minutes-readout" x-text="infinite ? '—' : minutes + ' min'"></span>
      </div>
    </div>
    {% endfor %}
    <span class="unsaved-badge" x-show="dirty" x-cloak>● Unsaved changes</span>
    <div class="stage-form-actions">
      <button type="submit" class="save-btn">Save</button>
      <button class="generate-btn" type="button" title="Generate {{ progression_label }}"
              aria-label="Generate {{ progression_label }}"
              hx-post="/api/generate/{{ progression }}" hx-target="#generate-result"
              hx-swap="innerHTML" hx-indicator="#generating">↻</button>
    </div>
  </form>
</div>
